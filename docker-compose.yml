# Local PostgreSQL for development and tests.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: corpmind
      POSTGRES_PASSWORD: corpmind_dev   # dev only; change for any shared environment
      POSTGRES_DB: corpmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpmind"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
