# Serves the built React app and proxies /api to the backend, so browser and API share one origin
# (needed for the SameSite=Strict session cookie; no CORS involved).
#
# Note: nginx drops server-level add_header lines in any location that has its own add_header,
# so locations below use `expires` for caching and add no headers of their own.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # 20 files x 20 MB per upload request, plus form overhead.
    client_max_body_size 410m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Everything is self-hosted (fonts included). blob: is for opening downloaded PDFs; data: for the favicon.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) the client IP: nginx is the edge, so a client-supplied
        # X-Forwarded-For would otherwise let anyone fake their IP in audit logs and rate limits.
        # If you put a TLS load balancer in front, trust it with set_real_ip_from + real_ip_header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # LLM answers can take a while
        proxy_request_buffering off;      # stream large uploads to the backend
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/chat/123, /documents...) all serve index.html, which must always be revalidated.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
